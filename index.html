<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kunoch Command</title>
<meta name="description" content="Daily business adviser for the Kunoch portfolio, by Insight360.">
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kunoch">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./app.css?v=4.1.0">
</head>
<body>

<!-- sign-in -->
<section id="auth" hidden>
  <div class="auth-card">
    <img class="auth-logo" src="./brand/insight360-logo.png" alt="Insight360 by IONEC" width="960" height="277">
    <h1>Kunoch Command</h1>
    <p class="auth-sub">Your daily business adviser.</p>
    <p class="auth-moved">This app has moved into <a href="https://command.insight360.biz/">Insight Command</a>: diary, tasks and adviser under one login.</p>
    <form id="auth-form" autocomplete="on">
      <label for="auth-email">Email</label>
      <input id="auth-email" type="email" inputmode="email" autocomplete="email" required placeholder="you@company.com">
      <div id="auth-pw-row" hidden>
        <label for="auth-pw">Password</label>
        <input id="auth-pw" type="password" autocomplete="current-password">
      </div>
      <button class="btn primary block" type="submit" id="auth-go">Send sign-in link</button>
      <button class="btn link block" type="button" id="auth-toggle">Use a password instead</button>
      <button class="btn link block" type="button" id="auth-forgot" hidden>Forgot or never set a password?</button>
      <p class="auth-msg" id="auth-msg" role="status"></p>
    </form>
  </div>
</section>

<!-- app -->
<div id="app" hidden>
  <header class="top">
    <img class="mark" src="./brand/insight360-mark.png" alt="" width="116" height="120">
    <button class="bizbtn" id="bizbtn" data-act="pick-biz" aria-haspopup="dialog"><span id="bizname">All businesses</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <nav class="tabs" aria-label="Sections">
      <button data-act="tab" data-tab="today" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Today</span></button>
      <button data-act="tab" data-tab="ask"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v11H10l-4.5 3.5v-3.5H4z"/></svg><span>Ask</span></button>
      <button data-act="tab" data-tab="library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M14.5 3.5V7.5h4M9 12h6M9 15.5h6"/></svg><span>Library</span></button>
    </nav>
    <button class="iconbtn" data-act="menu" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
  </header>
  <div id="demo-banner" hidden>Demo data — nothing here is real or saved.</div>
  <main id="view" tabindex="-1"></main>
</div>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-bg" data-act="close-sheet"></div>
  <div class="sheet-card" id="sheet-card"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="./vendor/supabase.js"></script>
<script src="./pdf.js?v=4.1.0"></script>
<script src="./app.js?v=4.1.0"></script>
</body>
</html>
